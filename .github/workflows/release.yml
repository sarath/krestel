name: Release & Publish to Thunderbird Add-ons Marketplace

on:
  push:
    branches: [main, master]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Publish as a pre-release version'
        required: false
        default: false
        type: boolean
      channel:
        description: 'Thunderbird Marketplace channel (auto = listed for release, unlisted for pre-release)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - listed
          - unlisted
      addons_server_url:
        description: 'Add-ons Marketplace Server URL (Thunderbird ATN or Mozilla AMO)'
        required: false
        default: 'https://addons.thunderbird.net'

permissions:
  contents: write

jobs:
  release:
    name: Build XPI, Cut Release & Publish to Thunderbird Marketplace
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Resolve release version & sync manifest.json / package.json
        id: version
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          AMO_CHANNEL: ${{ vars.AMO_CHANNEL || 'listed' }}
          AMO_PRERELEASE_CHANNEL: ${{ vars.AMO_PRERELEASE_CHANNEL || 'unlisted' }}
        run: node scripts/resolve-version.mjs

      - name: Install dependencies
        run: npm install

      - name: Run TypeScript typecheck & unit tests
        run: |
          npm run typecheck
          npm test

      - name: Build unpacked extension & kestrel.xpi
        run: npm run build

      - name: Upload kestrel.xpi artifact
        uses: actions/upload-artifact@v6
        with:
          name: kestrel-xpi-${{ steps.version.outputs.release_tag }}
          path: kestrel.xpi
          retention-days: 30

      - name: Create GitHub Release with kestrel.xpi
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: Kestrel ${{ steps.version.outputs.release_tag }}
          prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: kestrel.xpi

      - name: Publish kestrel.xpi to Thunderbird Add-ons Marketplace
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER || secrets.ATN_API_KEY }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET || secrets.ATN_API_SECRET }}
          AMO_CHANNEL: ${{ steps.version.outputs.channel }}
          PRERELEASE: ${{ steps.version.outputs.is_prerelease }}
          ADDONS_SERVER_URL: ${{ inputs.addons_server_url || vars.ADDONS_SERVER_URL || 'https://addons.thunderbird.net' }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "⚠️ Skipping Marketplace upload: AMO_JWT_ISSUER and AMO_JWT_SECRET repository secrets are not set."
            exit 0
          fi
          npm run publish:addons
